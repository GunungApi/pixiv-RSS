<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: sans-serif; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #ccc; padding: 4px; }
    </style>
  </head>
  <body>
    <h3>未承認候補</h3>
    <div id="list"></div>
    <button onclick="approve()">承認</button>
    <script>
      function load() {
        google.script.run.withSuccessHandler(render).getPendingRequests();
      }
      function render(data) {
        if (!data.length) { document.getElementById('list').textContent = 'なし'; return; }
        var html = '<table><tr><th></th><th>トークン</th><th>生徒名</th><th>候補日時</th><th>備考</th></tr>';
        data.forEach(function(r){
          html += '<tr>'+
                  '<td><input type="checkbox" value="'+r.row+'"></td>'+
                  '<td>'+r.token+'</td>'+
                  '<td>'+r.student+'</td>'+
                  '<td>'+new Date(r.datetime).toLocaleString('ja-JP')+'</td>'+
                  '<td>'+ (r.note||'') +'</td>'+
                  '</tr>';
        });
        html += '</table>';
        document.getElementById('list').innerHTML = html;
      }
      function approve() {
        var rows = Array.from(document.querySelectorAll('input[type=checkbox]:checked')).map(c=>c.value);
        google.script.run.withSuccessHandler(load).approveRequests(rows);
      }
      load();
    </script>
  </body>
</html>
